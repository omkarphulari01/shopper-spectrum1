[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopper-spectrum"
version = "1.0.0"
description = "Customer segmentation (RFM + clustering) and product recommendations for e-commerce."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "omkarphulari01" }]
keywords = ["rfm", "clustering", "recommender", "ecommerce", "streamlit"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "streamlit>=1.30",
    "streamlit-option-menu>=0.3.6",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1", "pre-commit>=3.0", "jupyter>=1.0"]

[project.scripts]
shopper-spectrum = "shopper_spectrum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702"]
